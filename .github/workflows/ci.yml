name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: egolabs
          POSTGRES_PASSWORD: egolabs
          POSTGRES_DB: egolabs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U egolabs" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://egolabs:egolabs@localhost:5432/egolabs_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libegl1 libgles2 libgl1
      - name: Cache model files and test photos
        uses: actions/cache@v4
        with:
          path: ~/.cache/egolabs/models
          key: egolabs-models-${{ hashFiles('backend/egolabs/cv/assets.py', 'backend/egolabs/cv/samples.py') }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: OpenAPI schema is up to date (run `make gen-api`)
        run: |
          python -m egolabs.openapi > ../web/lib/api/openapi.json
          git diff --exit-code -- ../web/lib/api/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date (run `make gen-api`)
        run: |
          npm run gen:api
          git diff --exit-code -- lib/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  stack:
    name: docker compose up + smoke test
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Production overrides are valid
        run: APP_DOMAIN=app.example.com FILES_DOMAIN=files.example.com CLOUDFLARE_TUNNEL_TOKEN=x docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Start the stack
        # The smoke test signs in with a password (people sign in with Google, which CI can't do).
        env:
          PASSWORD_LOGIN: "true"
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: scripts/smoke.sh
      - name: Service logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
